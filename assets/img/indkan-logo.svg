<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 84" width="100%" height="100%">
  <defs>
    <!-- Sphere Red Gradient: authentic deep red with rich glow -->
    <radialGradient id="sphereGlow" cx="42%" cy="36%" r="58%">
      <stop offset="0%" stop-color="#df3a43" />
      <stop offset="85%" stop-color="#be262f" />
      <stop offset="100%" stop-color="#a41d25" />
    </radialGradient>
    
    <!-- Corporate Blue Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a4e92" />
      <stop offset="50%" stop-color="#3b62ae" />
      <stop offset="100%" stop-color="#4e78ca" />
    </linearGradient>

    <!-- Star Glow / Sharp tip -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e78ca" />
      <stop offset="100%" stop-color="#2a4e92" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GROUP (X: 0..86, Y: 0..84) -->
  <g id="emblem">
    <!-- 1. The Red Planet / Globe -->
    <!-- Center: (48, 44), Radius: 27 -->
    <circle cx="48" cy="44" r="27" fill="url(#sphereGlow)" />

    <!-- 2. White separation clearance along orbit path across globe -->
    <path d="M 6 44 C 4 62 20 78 44 76 C 58 75 70 60 76 40 C 79 30 81 18 82 8" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- 3. Lower rim re-inforcement of the red sphere (so the bottom stays solid red) -->
    <path d="M 33 66 C 38 69 43 71 48 71 C 57 71 65 67 71 60 C 67 63 60 65 52 65 C 44 65 38 63 33 66 Z" 
          fill="url(#sphereGlow)" />

    <!-- 4. The Blue Orbital Swoosh -->
    <!-- Sweeps from top-right star, across sphere with white gap, loops outside globe on bottom-left -->
    <path d="M 82 8 
             C 80 17 76 29 70 41 
             C 61 57 48 68 34 68 
             C 18 68 9 58 8 46 
             C 8 36 13 26 21 19 
             C 17 23 15 29 15 36 
             C 15 48 23 57 36 57 
             C 52 57 66 43 74 27 
             C 78 19 80 12 82 8 Z" 
          fill="url(#orbitGrad)" />

    <!-- 5. Four-Pointed Star at apex (82, 7) -->
    <g transform="translate(82, 7)">
      <!-- Vertical spike -->
      <polygon points="0,-7 1.8,-1.8 7,0 1.8,1.8 0,7 -1.8,1.8 -7,0 -1.8,-1.8" fill="url(#starGrad)" />
      <!-- Star center sparkle dot -->
      <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP (X: 98..335, Y: 0..84) -->
  <g id="brand-text">
    <!-- "INDKAN" Main Title -->
    <text x="96" y="48" 
          font-family="'Poppins', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="46" 
          font-weight="900" 
          fill="#234685" 
          letter-spacing="0.8">INDKAN</text>

    <!-- Subtitle: "WORLD WIDE EXIM PVT. LIMITED" -->
    <text x="98" y="66" 
          font-family="'Poppins', 'Segoe UI', 'Arial', sans-serif" 
          font-size="11.2" 
          font-weight="700" 
          fill="#cc363e" 
          letter-spacing="1.4">WORLD WIDE EXIM PVT. LIMITED</text>
  </g>
</svg>
